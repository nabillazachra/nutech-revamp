name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_BASE_PATH: /nutech-revamp
      SITE_URL: https://nabillazachra.github.io/nutech-revamp
      ALLOW_INDEXING: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-fund --no-audit
      - name: Validate content
        run: npm run validate:content
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Build static export
        run: npm run build
      - name: Static export smoke test
        run: npm run smoke

      - name: Upload static export artifact
        uses: actions/upload-artifact@v4
        with:
          name: nutech-pages-preview
          path: out
          if-no-files-found: error
          retention-days: 7
